name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # three chunks in the book evaluate, and they are base R only - no greta,
      # no TensorFlow, no Python needed here
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      # HTML only: Pages serves the site, and the book's HTML carries no PDF
      # download link, so skipping the PDF avoids installing LaTeX
      - name: Render the book
        run: quarto render --to html

      # the artifact route, not `quarto publish gh-pages`: that one refuses to
      # run until a gh-pages branch already exists, which nothing creates
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - id: deployment
        uses: actions/deploy-pages@v4
